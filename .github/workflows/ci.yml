name: ci

# site/ is the product page, gated by site.yml; nothing in it is Go, so a change there
# alone does not run this (JCT14). A change touching both runs both.
on:
  push:
    branches: [main]
    paths-ignore: ["site/**", ".github/workflows/site.yml"]
  pull_request:
    paths-ignore: ["site/**", ".github/workflows/site.yml"]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: gofmt, go vet, go test in the pinned toolchain
        run: bash ci/check.sh
